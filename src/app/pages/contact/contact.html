<main class="py-5">
  <div class="container">

    <!-- Encabezado -->
    <div class="mb-5 text-center">
      <h1 class="fw-bold">Contacto</h1>
      <p class="subtitle">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    </div>

    <div class="row g-5">

      <!-- Formulario -->
      <div class="col-md-7">
        <div class="contact-card p-4">
          <h4 class="fw-bold mb-4">Envíanos un mensaje</h4>
          <div class="mb-3">
            <label class="form-label label-text">Nombre</label>
            <input type="text" class="form-control contact-input" placeholder="Tu nombre">
          </div>
          <div class="mb-3">
            <label class="form-label label-text">Correo electrónico</label>
            <input type="email" class="form-control contact-input" placeholder="tucorreo@email.com">
          </div>
          <div class="mb-3">
            <label class="form-label label-text">Asunto</label>
            <select class="form-select contact-input">
              <option value="">Selecciona un asunto</option>
              <option>Pedido o envío</option>
              <option>Producto específico</option>
              <option>Preventa</option>
              <option>Devolución o garantía</option>
              <option>Otro</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label label-text">Mensaje</label>
            <textarea class="form-control contact-input" rows="5" placeholder="Lorem ipsum dolor sit amet..."></textarea>
          </div>
          <button class="btn btn-yellow w-100">Enviar mensaje</button>
        </div>
      </div>

      <!-- Info y redes -->
      <div class="col-md-5 d-flex flex-column gap-4">

        <!-- Información de contacto -->
        <div class="contact-card p-4">
          <h4 class="fw-bold mb-4">Información de contacto</h4>
          <div class="d-flex align-items-start gap-3 mb-3">
            <span class="fs-4">📧</span>
            <div>
              <p class="fw-semibold mb-0">Correo</p>
              <p class="subtitle mb-0">contacto&#64;toywars.com</p>
            </div>
          </div>
          <div class="d-flex align-items-start gap-3 mb-3">
            <span class="fs-4">📞</span>
            <div>
              <p class="fw-semibold mb-0">Teléfono</p>
              <p class="subtitle mb-0">+52 664 000 0000</p>
            </div>
          </div>
          <div class="d-flex align-items-start gap-3">
            <span class="fs-4">📍</span>
            <div>
              <p class="fw-semibold mb-0">Dirección</p>
              <p class="subtitle mb-0">Lorem ipsum 123, Ciudad, País</p>
            </div>
          </div>
        </div>

        <!-- Redes sociales -->
        <div class="contact-card p-4">
          <h4 class="fw-bold mb-4">Redes sociales</h4>
          <div class="d-flex flex-column gap-2">
            <a href="#" class="social-link d-flex align-items-center gap-3 p-3">
              <span class="fs-4">📘</span>
              <span class="fw-semibold">Facebook</span>
            </a>
            <a href="#" class="social-link d-flex align-items-center gap-3 p-3">
              <span class="fs-4">📸</span>
              <span class="fw-semibold">Instagram</span>
            </a>
            <a href="#" class="social-link d-flex align-items-center gap-3 p-3">
              <span class="fs-4">🐦</span>
              <span class="fw-semibold">Twitter / X</span>
            </a>
            <a href="#" class="social-link d-flex align-items-center gap-3 p-3">
              <span class="fs-4">▶️</span>
              <span class="fw-semibold">YouTube</span>
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>
